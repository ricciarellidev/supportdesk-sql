name: Java and PostgreSQL verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: supportdesk_test
          POSTGRES_USER: supportdesk
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supportdesk -d supportdesk_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compile, test HTTP and SQL, and package
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/supportdesk_test
          TEST_DATABASE_USER: supportdesk
          TEST_DATABASE_PASSWORD: local_ci_only
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Store verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          if-no-files-found: ignore

openapi: 3.1.0
info:
  title: SupportDesk SQL API
  version: 1.0.0
  description:
    Projeto educacional local com dados fictícios. Papéis do catálogo são regras de negócio, sem autenticação
    de identidade.
  license:
    name: MIT
servers:
  - url: http://localhost:8080
tags:
  - name: Catálogos
  - name: Chamados
  - name: Relatórios
  - name: Operação
paths:
  /api/v1/departments:
    get:
      tags:
        - Catálogos
      summary: Listar departamentos
      operationId: listDepartment
      parameters:
        - &id001
          name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
          description:
            Identificador de até 64 caracteres alfanuméricos, hífen ou sublinhado; valor ausente/inválido
            é substituído.
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de correlação.
        "400": &id002
          description: JSON, campos ou parâmetros inválidos.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404": &id003
          description: Referência ou chamado não encontrado.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409": &id004
          description: Regra de negócio ou restrição de integridade impede a operação.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500": &id005
          description: Falha interna, sem detalhes de SQL na resposta.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      tags:
        - Catálogos
      summary: Criar departamentos
      operationId: createDepartment
      parameters:
        - *id001
      responses:
        "201":
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de correlação.
        "400": *id002
        "404": *id003
        "409": *id004
        "500": *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDepartment"
  /api/v1/categories:
    get:
      tags:
        - Catálogos
      summary: Listar categorias
      operationId: listCategory
      parameters:
        - *id001
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de correlação.
        "400": *id002
        "404": *id003
        "409": *id004
        "500": *id005
    post:
      tags:
        - Catálogos
      summary: Criar categorias
      operationId: createCategory
      parameters:
        - *id001
      responses:
        "201":
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de correlação.
        "400": *id002
        "404": *id003
        "409": *id004
        "500": *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategory"
  /api/v1/users:
    get:
      tags:
        - Catálogos
      summary: Listar usuários
      operationId: listUser
      parameters:
        - *id001
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de correlação.
        "400": *id002
        "404": *id003
        "409": *id004
        "500": *id005
    post:
      tags:
        - Catálogos
      summary: Criar usuários
      operationId: createUser
      parameters:
        - *id001
      responses:
        "201":
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de correlação.
        "400": *id002
        "404": *id003
        "409": *id004
        "500": *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
  /api/v1/tickets:
    get:
      tags:
        - Chamados
      summary: Listar chamados não arquivados
      operationId: listTickets
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TicketStatus"
        - name: priority
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Priority"
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: agentId
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - *id001
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketPage"
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de correlação.
        "400": *id002
        "404": *id003
        "409": *id004
        "500": *id005
    post:
      tags:
        - Chamados
      summary: Abrir chamado e registrar histórico
      operationId: createTicket
      parameters:
        - *id001
      responses:
        "201":
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de correlação.
            Location:
              schema:
                type: string
              description: Caminho do chamado criado.
        "400": *id002
        "404": *id003
        "409": *id004
        "500": *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTicket"
  /api/v1/tickets/{id}:
    get:
      tags:
        - Chamados
      summary: Consultar chamado e histórico
      operationId: getTicket
      parameters:
        - &id006
          name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - *id001
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de correlação.
        "400": *id002
        "404": *id003
        "409": *id004
        "500": *id005
    delete:
      tags:
        - Chamados
      summary: Arquivar chamado encerrado, preservando seu histórico
      operationId: archiveTicket
      parameters:
        - *id006
        - name: actorId
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - *id001
      responses:
        "204":
          description: Operação concluída.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de correlação.
        "400": *id002
        "404": *id003
        "409": *id004
        "500": *id005
  /api/v1/tickets/{id}/assignment:
    patch:
      tags:
        - Chamados
      summary: Atribuir agente ativo
      operationId: ticketAssignment
      parameters:
        - *id006
        - *id001
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de correlação.
        "400": *id002
        "404": *id003
        "409": *id004
        "500": *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Assignment"
  /api/v1/tickets/{id}/status:
    patch:
      tags:
        - Chamados
      summary: Alterar status segundo o ciclo de atendimento
      operationId: ticketTransition
      parameters:
        - *id006
        - *id001
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de correlação.
        "400": *id002
        "404": *id003
        "409": *id004
        "500": *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Transition"
  /api/v1/tickets/{id}/comments:
    post:
      tags:
        - Chamados
      summary: Adicionar comentário ao histórico
      operationId: ticketComment
      parameters:
        - *id006
        - *id001
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de correlação.
        "400": *id002
        "404": *id003
        "409": *id004
        "500": *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Comment"
  /api/v1/reports/overview:
    get:
      tags:
        - Relatórios
      summary: Consultar visão geral
      operationId: reportOverview
      parameters:
        - *id001
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de correlação.
        "400": *id002
        "404": *id003
        "409": *id004
        "500": *id005
  /api/v1/reports/by-category:
    get:
      tags:
        - Relatórios
      summary: Consultar demanda por categoria
      operationId: reportCategoryReport
      parameters:
        - *id001
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryReport"
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de correlação.
        "400": *id002
        "404": *id003
        "409": *id004
        "500": *id005
  /api/v1/reports/by-agent:
    get:
      tags:
        - Relatórios
      summary: Consultar carga de trabalho por agente ativo
      operationId: reportAgentReport
      parameters:
        - *id001
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentReport"
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de correlação.
        "400": *id002
        "404": *id003
        "409": *id004
        "500": *id005
  /api/v1/reports/sla:
    get:
      tags:
        - Relatórios
      summary: Consultar SLA por prioridade
      operationId: reportSlaReport
      parameters:
        - *id001
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SlaReport"
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de correlação.
        "400": *id002
        "404": *id003
        "409": *id004
        "500": *id005
  /actuator/health:
    get:
      tags:
        - Operação
      summary: Consultar saúde da aplicação e conexão com o banco
      operationId: health
      responses:
        "200":
          description: Aplicação disponível.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required:
                  - status
        "503":
          description: Aplicação ou banco indisponível.
components:
  schemas:
    Priority:
      type: string
      enum:
        - LOW
        - MEDIUM
        - HIGH
        - CRITICAL
    TicketStatus:
      type: string
      enum:
        - OPEN
        - IN_PROGRESS
        - RESOLVED
        - CLOSED
    UserRole:
      type: string
      enum:
        - REQUESTER
        - AGENT
    Department:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 80
      required:
        - id
        - name
    CreateDepartment:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
      required:
        - name
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 80
        departmentId:
          type: integer
          format: int64
          minimum: 1
        departmentName:
          type: string
          minLength: 1
          maxLength: 80
      required:
        - id
        - name
        - departmentId
        - departmentName
    CreateCategory:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        departmentId:
          type: integer
          format: int64
          minimum: 1
      required:
        - name
        - departmentId
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        departmentId:
          type: integer
          format: int64
          minimum: 1
        active:
          type: boolean
      required:
        - id
        - name
        - email
        - role
        - departmentId
        - active
    CreateUser:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 160
        role:
          $ref: "#/components/schemas/UserRole"
        departmentId:
          type: integer
          format: int64
          minimum: 1
      required:
        - name
        - email
        - role
        - departmentId
    CreateTicket:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 140
        description:
          type: string
          minLength: 1
          maxLength: 4000
        requesterId:
          type: integer
          format: int64
          minimum: 1
        categoryId:
          type: integer
          format: int64
          minimum: 1
        priority:
          $ref: "#/components/schemas/Priority"
      required:
        - title
        - description
        - requesterId
        - categoryId
        - priority
    Assignment:
      type: object
      properties:
        agentId:
          type: integer
          format: int64
          minimum: 1
        actorId:
          type: integer
          format: int64
          minimum: 1
      required:
        - agentId
        - actorId
    Transition:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/TicketStatus"
        actorId:
          type: integer
          format: int64
          minimum: 1
        message:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - status
        - actorId
        - message
    Comment:
      type: object
      properties:
        actorId:
          type: integer
          format: int64
          minimum: 1
        message:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - actorId
        - message
    TicketView:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 140
        description:
          type: string
          minLength: 1
          maxLength: 4000
        requesterId:
          type: integer
          format: int64
          minimum: 1
        requesterName:
          type: string
          minLength: 1
          maxLength: 100
        categoryId:
          type: integer
          format: int64
          minimum: 1
        categoryName:
          type: string
          minLength: 1
          maxLength: 80
        departmentId:
          type: integer
          format: int64
          minimum: 1
        departmentName:
          type: string
          minLength: 1
          maxLength: 80
        assignedAgentId:
          type:
            - integer
            - "null"
          format: int64
          minimum: 1
        assignedAgentName:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 100
        priority:
          $ref: "#/components/schemas/Priority"
        status:
          $ref: "#/components/schemas/TicketStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        dueAt:
          type: string
          format: date-time
        resolvedAt:
          type:
            - string
            - "null"
          format: date-time
        closedAt:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - title
        - description
        - requesterId
        - requesterName
        - categoryId
        - categoryName
        - departmentId
        - departmentName
        - assignedAgentId
        - assignedAgentName
        - priority
        - status
        - createdAt
        - updatedAt
        - dueAt
        - resolvedAt
        - closedAt
    EventView:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        actorId:
          type: integer
          format: int64
          minimum: 1
        actorName:
          type: string
          minLength: 1
          maxLength: 100
        eventType:
          type: string
          enum:
            - CREATED
            - ASSIGNED
            - STATUS_CHANGED
            - COMMENT_ADDED
            - ARCHIVED
        previousStatus:
          type:
            - string
            - "null"
        newStatus:
          type:
            - string
            - "null"
        message:
          type: string
          minLength: 1
          maxLength: 2000
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - actorId
        - actorName
        - eventType
        - previousStatus
        - newStatus
        - message
        - createdAt
    TicketDetail:
      type: object
      properties:
        ticket:
          $ref: "#/components/schemas/TicketView"
        history:
          type: array
          items:
            $ref: "#/components/schemas/EventView"
      required:
        - ticket
        - history
    TicketPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/TicketView"
        totalElements:
          type: integer
          format: int64
          minimum: 0
        page:
          type: integer
          format: int64
          minimum: 0
        size:
          type: integer
          format: int64
          minimum: 1
        totalPages:
          type: integer
          format: int64
          minimum: 0
      required:
        - content
        - totalElements
        - page
        - size
        - totalPages
    Overview:
      type: object
      properties:
        totalTickets:
          type: integer
          format: int64
          minimum: 0
        openBacklog:
          type: integer
          format: int64
          minimum: 0
        resolvedTickets:
          type: integer
          format: int64
          minimum: 0
        overdueBacklog:
          type: integer
          format: int64
          minimum: 0
        averageResolutionHours:
          type:
            - number
            - "null"
      required:
        - totalTickets
        - openBacklog
        - resolvedTickets
        - overdueBacklog
        - averageResolutionHours
    CategoryReport:
      type: object
      properties:
        categoryId:
          type: integer
          format: int64
          minimum: 1
        categoryName:
          type: string
          minLength: 1
          maxLength: 80
        totalTickets:
          type: integer
          format: int64
          minimum: 0
        openBacklog:
          type: integer
          format: int64
          minimum: 0
        averageResolutionHours:
          type:
            - number
            - "null"
      required:
        - categoryId
        - categoryName
        - totalTickets
        - openBacklog
        - averageResolutionHours
    AgentReport:
      type: object
      properties:
        agentId:
          type: integer
          format: int64
          minimum: 1
        agentName:
          type: string
          minLength: 1
          maxLength: 100
        assignedTickets:
          type: integer
          format: int64
          minimum: 0
        openBacklog:
          type: integer
          format: int64
          minimum: 0
        resolvedTickets:
          type: integer
          format: int64
          minimum: 0
      required:
        - agentId
        - agentName
        - assignedTickets
        - openBacklog
        - resolvedTickets
    SlaReport:
      type: object
      properties:
        priority:
          $ref: "#/components/schemas/Priority"
        resolvedTickets:
          type: integer
          format: int64
          minimum: 0
        withinSla:
          type: integer
          format: int64
          minimum: 0
        compliancePercent:
          type:
            - number
            - "null"
      required:
        - priority
        - resolvedTickets
        - withinSla
        - compliancePercent
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          format: int64
          minimum: 100
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        requestId:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
            required:
              - field
              - message
      required:
        - title
        - status
        - detail
        - instance
        - code
        - requestId

services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: supportdesk
      POSTGRES_USER: ${DB_USER:-supportdesk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_demo_only}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/01-create-test-db.sql:/docker-entrypoint-initdb.d/01-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d supportdesk"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_URL: jdbc:postgresql://db:5432/supportdesk
      DB_USER: ${DB_USER:-supportdesk}
      DB_PASSWORD: ${DB_PASSWORD:-local_demo_only}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
  tests:
    image: maven:3.9.11-eclipse-temurin-17
    profiles: [test]
    working_dir: /workspace
    volumes:
      - .:/workspace
      - maven-cache:/root/.m2
    environment:
      TEST_DATABASE_URL: jdbc:postgresql://db:5432/supportdesk_test
      TEST_DATABASE_USER: ${DB_USER:-supportdesk}
      TEST_DATABASE_PASSWORD: ${DB_PASSWORD:-local_demo_only}
    command: ["bash", "./mvnw", "--batch-mode", "--no-transfer-progress", "clean", "verify"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
  maven-cache:
